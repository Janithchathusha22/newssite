# ==============================================================================
# BUSINESS LEADERS / CEYLON LEDGER - CONTABO PRODUCTION NGINX CONFIGURATION
# ==============================================================================

# 1. PUBLIC WEBSITE (PORT 80)
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Set server_name to _ (catches any IP/domain) or your specific domain:
    # server_name yourdomain.com www.yourdomain.com;
    server_name _;

    root /var/www/newssite/apps/public/dist;
    index index.html;

    client_max_body_size 30M;

    # Gzip compression for high speed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # React Router SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to Node.js Express backend (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # Proxy cached scraped images directly from backend
    location ~ ^/(assets|ft_images|news_images|images|downloaded_images)/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

# 2. EDITORIAL ADMIN DASHBOARD (PORT 8080)
