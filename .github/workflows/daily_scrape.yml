name: Automated Daily News Scraper & AI Localization

on:
  schedule:
    # Runs every 3 hours automatically on GitHub Cloud
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scraper & AI Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'llama-3.3-70b-versatile'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          AI_PROVIDER: 'auto'
          PYTHONUNBUFFERED: '1'
        run: |
          python daily_runner.py

      - name: Commit & Push Fresh News Feeds
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Newsroom"
          git add news_feed.json news_feed.js news.db daily_news_export.xlsx news_feed.csv
          if git diff --staged --quiet; then
            echo "No feed changes detected."
          else
            git commit -m "Auto-refresh news feed: $(date -u +'%Y-%m-%d %H:%M:%SZ') [skip ci]"
            git push
          fi
