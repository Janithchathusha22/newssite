# ==========================================
# CEYLON LEDGER - NGINX CONFIGURATION
# ==========================================

# 1. PUBLIC WEBSITE (PORT 80)
server {
    listen 80;
    server_name _;
    client_max_body_size 30M;

    root /usr/share/nginx/html/public;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SPA Client-Side Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy to Node.js Express Backend
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Proxy publisher and news image directories from backend
    location ~ ^/(assets|ft_images|news_images|images|downloaded_images)/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

