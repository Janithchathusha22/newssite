services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ceylon_ledger_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=5000
      - NODE_ENV=production
      - EDITORIAL_BACKEND=${EDITORIAL_BACKEND:-local}
      - PYTHONUNBUFFERED=1
      - AUTO_SYNC_ENABLED=true
      - AUTO_SYNC_RUN_ON_START=true
      - AUTO_SYNC_INTERVAL_MINUTES=${AUTO_SYNC_INTERVAL_MINUTES:-60}
    volumes:
      - ./news.db:/app/news.db
      - ./daily_news_export.xlsx:/app/daily_news_export.xlsx
      - ./news_feed.csv:/app/news_feed.csv
      - ./news_feed.json:/app/news_feed.json
      - ./news_data.json:/app/news_data.json
      - ./editorial:/app/editorial
      - ./assets:/app/assets
      - ./downloaded_images:/app/downloaded_images
      - ./ft_images:/app/ft_images
      - ./news_images:/app/news_images
      - ./images:/app/images
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ceylon_ledger_web
    restart: unless-stopped
    ports:
      - "3000:80"     # Public Website -> http://YOUR_SERVER_IP:3000
      - "8080:8080"   # Admin Dashboard -> http://YOUR_SERVER_IP:8080
    depends_on:
      - backend
